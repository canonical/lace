name: Rust CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

jobs:
  fmt:
    name: Format Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          components: rustfmt

      - name: Check formatting
        run: cargo fmt --all -- --check

  clippy:
    name: Clippy Lints
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          components: clippy

      - name: Run clippy
        run: cargo clippy --workspace -- -D warnings

  clippy-platform:
    name: "Clippy: ${{ matrix.package }} (${{ matrix.platform }})"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package: [lace-platform, lace-stubble, lace-speedboot]
        include:
          - platform: efi
            target: x86_64-unknown-uefi
            toolchain: stable
            build_std: ""
          - platform: bios
            target: lace-platform/src/bios/x86_64-bios.json
            toolchain: nightly
            build_std: "-Zbuild-std=core,compiler_builtins,alloc -Zbuild-std-features=compiler-builtins-mem -Zjson-target-spec"
          - platform: virt
            target: lace-platform/src/virt/x86_64-virt.json
            toolchain: nightly
            build_std: "-Zbuild-std=core,compiler_builtins,alloc -Zbuild-std-features=compiler-builtins-mem -Zjson-target-spec"
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: ${{ matrix.toolchain }}
          components: clippy, rust-src

      - name: Run clippy
        run: cargo clippy -p ${{ matrix.package }} --target ${{ matrix.target }} ${{ matrix.build_std }} -- -D warnings

  test:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable

      - name: Run unit tests
        run: cargo test --workspace

  coverage:
    name: Coverage testing
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable

      - name: Install cargo-tarpaulin
        run: cargo install cargo-tarpaulin

      - name: Run coverage through tarpaulin
        run: |
          set -e
          COVERAGE_DIR="coverage"
          mkdir -p "$COVERAGE_DIR"
          cargo tarpaulin --out Lcov --output-dir "$COVERAGE_DIR"
          mv "$COVERAGE_DIR/lcov.info" "$COVERAGE_DIR/coverage.lcov"

      - name: Upload coverage to Coveralls
        uses: coverallsapp/github-action@v2
        env:
          COVERALLS_REPO_TOKEN: ${{ secrets.COVERALLS_REPO_TOKEN }}
        if: ${{ github.event_name != 'pull_request' || env.COVERALLS_REPO_TOKEN != '' }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          files: "coverage/*.lcov"
