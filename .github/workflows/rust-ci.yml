# SPDX-License-Identifier: GPL-2.0-only OR GPL-3.0-only
name: Rust CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

jobs:
  check:
    name: Cargo Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable

      - name: Run cargo check
        run: ./scripts/cargo_ci.py check --workspace

  fmt:
    name: Format Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          components: rustfmt

      - name: Check formatting
        run: ./scripts/cargo_ci.py fmt --all -- --check

  clippy:
    name: Clippy Lints
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          components: clippy

      - name: Run clippy
        run: ./scripts/cargo_ci.py clippy --workspace -- -D warnings

  test:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable

      - name: Run unit tests
        run: ./scripts/cargo_ci.py test --workspace

  coverage:
    name: Coverage testing
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable

      - name: Install cargo-tarpaulin
        run: cargo install cargo-tarpaulin
      
      - name: Run coverage through tarpaulin
        run: |
          COVERAGE_DIR="coverage"
          mkdir -p "$COVERAGE_DIR"
          CRATES=$(cargo metadata --no-deps --format-version 1 \
            | jq -r '.packages[].name')
          for crate in $CRATES; do
            if cargo tarpaulin -p "$crate" --out Lcov --output-dir "$COVERAGE_DIR" --no-fail-fast; then
              mv "$COVERAGE_DIR/lcov.info" "$COVERAGE_DIR/$crate.lcov"
            fi
          done
      
      - name: Install Universal Coverage Reporter
        run: curl -L https://coveralls.io/coveralls-linux.tar.gz | tar -xz

      - name: Upload to Coveralls
        env:
          COVERALLS_REPO_TOKEN: ${{ secrets.COVERALLS_REPO_TOKEN }}
        run: ./coveralls
 