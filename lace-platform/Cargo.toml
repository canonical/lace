[package]
name = "lace-platform"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
bitflags.workspace = true
ext4-view = { workspace = true, optional = true }
lace-util = { path = "../lace-util", default-features = false }
lace-util-derive = { path = "../lace-util-derive" }
log.workspace = true
spin.workspace = true
zerocopy = { workspace = true, features = ["derive"] }

# BIOS and virt share a linked-list heap allocator.
[target.'cfg(any(target_os = "bios", target_os = "virt"))'.dependencies]
linked_list_allocator = { workspace = true }

# Virt needs the shared hardware drivers for PCI, fw_cfg, etc.
[target.'cfg(target_os = "virt")'.dependencies]
lace-drivers = { path = "../lace-drivers", default-features = false }

# EFI pulls in the uefi crate for services and types.
[target.'cfg(target_os = "uefi")'.dependencies]
uefi = { workspace = true, features = ["global_allocator"] }
uefi-raw = { workspace = true }

[features]
default = ["ext4"]
ext4 = ["ext4-view", "fs-impls"]
fs-impls = []

[dev-dependencies]
lace-util = { path = "../lace-util", features = ["std"] }

[lints]
workspace = true
