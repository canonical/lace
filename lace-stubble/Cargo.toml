[package]
name = "lace-stubble"
version = "0.1.0"
edition = "2024"
license = "GPL-2.0-only OR GPL-3.0-only"

[dependencies]
lace-util = { version = "0.1.0", path = "../lace-util", default-features = false }
lace-platform = { version = "0.1.0", path = "../lace-platform", default-features = false, features = ["efi"] }

[target."cfg(target_os = \"uefi\")".dependencies]
uefi = { version = "0.36.0", features = ["global_allocator", "panic_handler"] }

[target."cfg(not(target_os = \"uefi\"))".dependencies]
uefi = { version = "0.36.0", features = [] }
